<div
  #mainContent
  class="main-content menu-{{ tempDrawerType }}"
  [class.drawer-lock]="drawerLock"
  [class.drawer-open]="drawerVisible"
  [class.overflow-hidden]="
    ['push', 'push-mask'].includes(drawerType) && drawerVisible && !drawerLock
  "
>
  <div class="inner-wrapper">
    <nav>
      <div class="container">
        @if (!drawerLock) {
          <pw-button icon="pi pi-bars" appearance="text" (click)="toggleDrawerClick()" />
        }

        <app-logo
          [type]="
            config.powellConfig.theme?.mode == 'light' ? 'dark-horizontal' : 'light-horizontal'
          "
        />

        <div>
          <pw-button
            pTooltip="Design"
            tooltipPosition="bottom"
            severity="secondary"
            (click)="designerDrawerVisible = !designerDrawerVisible"
            icon="pi pi-cog animate-[spin_5s_linear_infinite]"
          />
          <pw-button
            icon="pi pi-sparkles"
            pTooltip="Overlay Types"
            tooltipPosition="bottom"
            (onClick)="op.toggle($event)"
          />
          <a
            target="_blank"
            href="https://github.com/mohammadreza99/powell"
            pTooltip="Github"
            tooltipPosition="bottom"
          >
            <pw-button appearance="text" severity="secondary" icon="pi pi-github" />
          </a>
        </div>
      </div>
    </nav>

    <main>
      @if (tempDrawerType === 'horizontal') {
        <p-menubar
          class="overflow-auto [&_ul]:!flex-nowrap [&_ul]:!whitespace-nowrap"
          [model]="drawerItems"
        >
          <ng-template pTemplate="start">
            <pw-button class="me-2" (onClick)="op.toggle($event)" icon="pi pi-sparkles" />
            <app-logo />
          </ng-template>
        </p-menubar>
      }

      <ng-content />
    </main>
  </div>
</div>

<p-drawer
  [styleClass]="!showBackdrop ? '!bg-transparent backdrop-blur-lg' : ''"
  [dismissible]="showBackdrop"
  [closable]="false"
  [modal]="showBackdrop"
  [visible]="drawerVisible"
  [closeOnEscape]="false"
  [blockScroll]="showBackdrop"
  [position]="config.rtl ? 'right' : 'left'"
  [appendTo]="mainContent"
  (visibleChange)="toggleDrawer($event)"
>
  <ng-template pTemplate="header">
    <div class="flex items-center w-full gap-2">
      <pw-input-text
        class="grow"
        [fluid]="true"
        labelPosition="top"
        size="small"
        [followConfig]="false"
        [placeholder]="'searchComponents' | translate"
        [(ngModel)]="searchValue"
      />
      @if (!drawerLock) {
        <pw-button
          appearance="text"
          size="small"
          [rounded]="true"
          icon="pi pi-times"
          (onClick)="toggleDrawerClick()"
        />
      }
      @if (!showBackdrop) {
        <i
          class="ms-2 !hidden md:!inline border rounded-full cursor-pointer hover:opacity-70 pi pi-circle{{
            drawerLock ? '-fill' : ''
          }}"
          (click)="toggleDrawerLockClick()"
        ></i>
      }
    </div>
  </ng-template>
  <p-panelMenu [multiple]="false" [model]="drawerItems | pwFilter: searchValue : 'label'" />
</p-drawer>

<p-drawer
  position="left"
  [header]="'designSystem' | translate"
  [modal]="false"
  [closable]="true"
  [(visible)]="designerDrawerVisible"
  styleClass="!w-[48rem] max-w-full !bg-transparent backdrop-blur-lg"
>
  <app-designer />
</p-drawer>

<p-popover #op>
  <pw-radio
    [value]="tempDrawerType"
    [options]="drawerTypes"
    (onChange)="changeDrawerType($event, true); op?.hide()"
  />
</p-popover>
